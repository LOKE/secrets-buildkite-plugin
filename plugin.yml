name: "LOKE Secrets"
description: Read secrets from AWS SSM param store using an assumed buildkite role
author: https://github.com/LOKE
requirements:
  - aws
  - jq
configuration:
  properties:
    role-arn:
      type: string
    env:
      type: object
      additionalProperties:
        type: string
    vars:
      type: array
      items:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      minItems: 1
      maxItems: 10
  required: ["role-arn"]
  anyOf:
    - required: ["vars"]
    - required: ["env"]
  additionalProperties: false
